    <style id="expo-reset">
      html, body { height: 100%; margin: 0; overscroll-behavior-y: contain; }
      body {
        overflow: auto;
        overscroll-behavior-y: contain;
        /* Match storefront footer so any svh/viewport seam below #root isn’t a white flash. */
        background: #000000;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #root {
        display: flex;
        min-height: 100%;
        width: 100%;
        flex: 1;
        background: #ffffff;
      }
      /* RN Web TextInput renders native <input> — does not inherit body font without an explicit rule */
      input,
      textarea,
      select {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      /* SearchPill multiline textarea — thin thumb matching semanticColors.goldMuted (#B8AC7F) */
      #root .gj-search-pill-input {
        scrollbar-width: thin;
        scrollbar-color: #B8AC7F transparent;
      }
      #root .gj-search-pill-input::-webkit-scrollbar {
        width: 4px;
      }
      #root .gj-search-pill-input::-webkit-scrollbar-track {
        background: transparent;
      }
      #root .gj-search-pill-input::-webkit-scrollbar-thumb {
        background-color: #B8AC7F;
        border-radius: 2px;
      }
      /* Collapsed single-line: hide overflow chrome (gold thumb looked like a blob under the arrow). */
      #root .gj-search-pill-input--collapsed {
        overflow: hidden !important;
        scrollbar-width: none;
      }
      #root .gj-search-pill-input--collapsed::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      #root .gj-search-pill-input::-webkit-resizer {
        display: none;
      }
      #root input:focus,
      #root textarea:focus {
        outline: none;
      }
      /* Click/tap: no focus ring. Keyboard navigation still uses :focus-visible. */
      #root button:focus:not(:focus-visible),
      #root [role="button"]:focus:not(:focus-visible),
      #root a:focus:not(:focus-visible),
      #root [tabindex]:focus:not(:focus-visible) {
        outline: none !important;
        box-shadow: none !important;
      }
      #main-tab-bar button:focus,
      #main-tab-bar [role="button"]:focus,
      #main-tab-bar a:focus,
      #main-tab-bar *:focus,
      #root [data-testid="main-tab-bar"] button:focus,
      #root [data-testid="main-tab-bar"] [role="button"]:focus,
      #root [data-testid="main-tab-bar"] a:focus,
      #root [data-testid="main-tab-bar"] *:focus,
      #root [role="tab"]:focus {
        outline: none !important;
      }
      #root [data-testid="sidebar-collapse-btn"]:focus:not(:focus-visible),
      #root [data-testid="sidebar-collapse-btn"]:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }
      #root [data-testid="desktop-side-rail"] img:focus,
      #root [data-testid="desktop-side-rail"] img:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }
      #root,
      #root > div {
        overflow: visible !important;
      }
      #root [data-testid="desktop-side-rail"] {
        z-index: 30 !important;
      }
      /* Panel host clips to its box; do not use overflow-x:hidden + overflow-y:visible
         elsewhere — CSS forces the visible axis to auto and creates a nested Y scrollport. */
      #root [data-testid="home-scroll-host"] {
        overflow: hidden !important;
      }
      #root [data-testid="home-rail-bleed"] {
        overflow: visible !important;
      }
      /* Vertical home scroll — fixed width; never grow horizontally when rails pan */
      #root .gj-home-scroll,
      #root [data-testid="home-vertical-scroll"] {
        overflow-x: hidden !important;
        overflow-y: auto !important;
        scrollbar-gutter: stable;
      }
      /* Content wrapper must stay overflow:visible so rail shadow bleed isn't a nested scroller */
      #root .gj-home-scroll > div,
      #root [data-testid="home-vertical-scroll"] > div {
        overflow: visible !important;
      }
      /* My Box / box-detail section tabs — same constrained scrollport pattern as Home */
      #root [data-testid="box-scroll-host"] {
        overflow: hidden !important;
      }
      #root .gj-box-scroll,
      #root [data-testid="box-vertical-scroll"] {
        overflow-x: hidden !important;
        overflow-y: auto !important;
        scrollbar-gutter: auto;
        max-width: 100%;
        min-width: 0;
        /* Keep scroll; hide the track so it doesn’t sit in the content column. */
        scrollbar-width: none;
      }
      #root .gj-box-scroll::-webkit-scrollbar,
      #root [data-testid="box-vertical-scroll"]::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }
      #root .gj-box-scroll > div,
      #root [data-testid="box-vertical-scroll"] > div {
        overflow: visible !important;
      }
      /* Horizontal rails: prefer vertical page scroll until JS axis-lock claims a clear pan-x. */
      #root .gj-horizontal-rail-scroll {
        overflow-x: auto !important;
        overflow-y: hidden !important;
        overscroll-behavior-x: contain;
        touch-action: pan-y pinch-zoom;
        -webkit-overflow-scrolling: touch;
        cursor: grab;
      }
      #root .gj-horizontal-rail-scroll.gj-horizontal-rail-dragging,
      #root .gj-horizontal-rail-scroll.gj-horizontal-rail-locked-x {
        cursor: grabbing;
        user-select: none;
        /* JS is driving scrollLeft — block the browser from stealing the gesture. */
        touch-action: none;
      }
      /* Storefront: one vertical scrollport; chrome/footer live in the page flow.
         Use svh (small viewport) so iOS URL-bar show/hide doesn't leave a dead bottom gap. */
      #root [data-testid="storefront-scroll-host"] {
        overflow: hidden !important;
        height: 100% !important;
        max-height: 100svh !important;
        display: flex !important;
        flex-direction: column !important;
      }
      #root .gj-storefront-scroll,
      #root [data-testid="storefront-vertical-scroll"] {
        overflow-x: hidden !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y pinch-zoom;
        /* contain (not none) lets rubber-band / pull-to-refresh work at the edges */
        overscroll-behavior-y: contain;
        flex: 1 1 auto !important;
        min-height: 0 !important;
      }
      #root .gj-storefront-scroll > div,
      #root [data-testid="storefront-vertical-scroll"] > div {
        overflow: visible !important;
        /* Short pages: grow to the scrollport so footer marginTop:auto can pin bottom */
        display: flex !important;
        flex-direction: column !important;
        flex-grow: 1 !important;
        min-height: 100% !important;
      }
      #root .gj-storefront-h-scroll {
        overflow-x: auto !important;
        overflow-y: hidden !important;
        overscroll-behavior-x: contain;
        touch-action: pan-x pan-y;
        -webkit-overflow-scrolling: touch;
      }
      #main-tab-bar button,
      #main-tab-bar [role="button"],
      #root [data-testid="main-tab-bar"] button,
      #root [data-testid="main-tab-bar"] [role="button"] {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        margin: 0;
        min-height: 0;
        border: none;
        background: transparent;
        line-height: 0;
      }
