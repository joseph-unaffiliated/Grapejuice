<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline' https://apis.google.com https://*.google.com https://www.gstatic.com https://use.typekit.net https://js.stripe.com; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.firebaseio.com wss://*.firebaseio.com https://*.cloudfunctions.net https://accounts.google.com https://api.unsplash.com https://api.stripe.com https://*.stripe.com; frame-src 'self' https://accounts.google.com https://*.google.com https://*.firebaseapp.com https://*.web.app https://js.stripe.com https://hooks.stripe.com; img-src 'self' data: blob: https://images.unsplash.com https://placehold.co https://*.stripe.com https://*.googleusercontent.com https://storage.googleapis.com https://*.firebasestorage.app https://firebasestorage.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://use.typekit.net; font-src 'self' https://fonts.gstatic.com https://use.typekit.net;" />
    <title>Grapejuice</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="shortcut icon" href="/favicon.png" />
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; }
      body {
        overflow: auto;
        background: #ffffff;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      /* RN Web TextInput renders native <input> — does not inherit body font without an explicit rule */
      input,
      textarea,
      select {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #root {
        display: flex;
        min-height: 100%;
        width: 100%;
        flex: 1;
      }
      #root input:focus,
      #root textarea:focus {
        outline: none;
      }
      #main-tab-bar button:focus,
      #main-tab-bar [role="button"]:focus,
      #main-tab-bar a:focus,
      #main-tab-bar *:focus,
      #root [data-testid="main-tab-bar"] button:focus,
      #root [data-testid="main-tab-bar"] [role="button"]:focus,
      #root [data-testid="main-tab-bar"] a:focus,
      #root [data-testid="main-tab-bar"] *:focus,
      #root [role="tab"]:focus {
        outline: none !important;
      }
      #root [data-testid="sidebar-collapse-btn"]:focus:not(:focus-visible),
      #root [data-testid="sidebar-collapse-btn"]:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }
      #root [data-testid="desktop-side-rail"] img:focus,
      #root [data-testid="desktop-side-rail"] img:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }
      #root,
      #root > div {
        overflow: visible !important;
      }
      #root [data-testid="desktop-side-rail"] {
        z-index: 30 !important;
      }
      /* Panel host clips to its box; do not use overflow-x:hidden + overflow-y:visible
         elsewhere — CSS forces the visible axis to auto and creates a nested Y scrollport. */
      #root [data-testid="home-scroll-host"] {
        overflow: hidden !important;
      }
      #root [data-testid="home-rail-bleed"] {
        overflow: visible !important;
      }
      /* Vertical home scroll — fixed width; never grow horizontally when rails pan */
      #root .gj-home-scroll,
      #root [data-testid="home-vertical-scroll"] {
        overflow-x: hidden !important;
        overflow-y: auto !important;
        scrollbar-gutter: stable;
      }
      /* Content wrapper must stay overflow:visible so rail shadow bleed isn't a nested scroller */
      #root .gj-home-scroll > div,
      #root [data-testid="home-vertical-scroll"] > div {
        overflow: visible !important;
      }
      /* My Box / box-detail section tabs — same constrained scrollport pattern as Home */
      #root [data-testid="box-scroll-host"] {
        overflow: hidden !important;
      }
      #root .gj-box-scroll,
      #root [data-testid="box-vertical-scroll"] {
        overflow-x: hidden !important;
        overflow-y: auto !important;
        scrollbar-gutter: stable;
      }
      #root .gj-box-scroll > div,
      #root [data-testid="box-vertical-scroll"] > div {
        overflow: visible !important;
      }
      /* Horizontal catalog rails — allow vertical pans to reach the page scroller */
      #root .gj-horizontal-rail-scroll {
        overflow-x: auto !important;
        overflow-y: hidden !important;
        overscroll-behavior-x: contain;
        touch-action: pan-x pan-y;
        -webkit-overflow-scrolling: touch;
        cursor: grab;
      }
      #root .gj-horizontal-rail-scroll.gj-horizontal-rail-dragging {
        cursor: grabbing;
        user-select: none;
      }
      /* Storefront: one vertical scrollport; chrome/footer live in the page flow */
      #root [data-testid="storefront-scroll-host"] {
        overflow: hidden !important;
        height: 100% !important;
        max-height: 100dvh !important;
        display: flex !important;
        flex-direction: column !important;
      }
      #root .gj-storefront-scroll,
      #root [data-testid="storefront-vertical-scroll"] {
        overflow-x: hidden !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y pinch-zoom;
        overscroll-behavior-y: auto;
        flex: 1 1 auto !important;
        min-height: 0 !important;
      }
      #root .gj-storefront-scroll > div,
      #root [data-testid="storefront-vertical-scroll"] > div {
        overflow: visible !important;
      }
      #root .gj-storefront-h-scroll {
        overflow-x: auto !important;
        overflow-y: hidden !important;
        overscroll-behavior-x: contain;
        touch-action: pan-x pan-y;
        -webkit-overflow-scrolling: touch;
      }
      #main-tab-bar button,
      #main-tab-bar [role="button"],
      #root [data-testid="main-tab-bar"] button,
      #root [data-testid="main-tab-bar"] [role="button"] {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        margin: 0;
        min-height: 0;
        border: none;
        background: transparent;
        line-height: 0;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=block avoids FOUT layout jump; include all weights the app uses (200–700). -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,400;0,9..40,500;0,9..40,700&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
